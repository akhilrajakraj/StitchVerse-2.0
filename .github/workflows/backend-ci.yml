name: Backend CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      SECRET_KEY: ci-only-secret-key-not-for-production
      DJANGO_SETTINGS_MODULE: config.settings.development
      DEBUG: 'False'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements/production.txt ]; then pip install -r requirements/production.txt; fi
          if [ -f requirements/development.txt ]; then pip install -r requirements/development.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Django system checks
        run: python manage.py check

      - name: Migration consistency check
        run: python manage.py makemigrations --check --dry-run

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: python manage.py test
